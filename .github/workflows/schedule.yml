name: Zenquant Auto-Inject

on:
  workflow_dispatch:

concurrency:
  group: zenquant-auto-inject
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-24.04

    # Run everything inside an environment where
    # Chromium + Playwright Linux dependencies already exist.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host

    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node Dependencies
        run: npm ci

      - name: Restore Session State
        uses: actions/cache@v4
        with:
          path: storageState.json
          key: session-state-v2-${{ github.run_id }}
          restore-keys: |
            session-state-v2-

      - name: Verify Playwright
        run: |
          node --version
          npx playwright --version
          npx playwright install --list

      - name: Run Injection Script
        timeout-minutes: 10
        env:
          ZENQUANT_PHONE: ${{ secrets.ZENQUANT_PHONE }}
          ZENQUANT_PASSWORD: ${{ secrets.ZENQUANT_PASSWORD }}
        run: node inject.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: "*.png"
          if-no-files-found: ignore

  # Separate job so the timer still gets fired even if
  # the Playwright automation fails.
  schedule-next-run:
    needs: run-automation
    if: always()

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger 3-hour timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run timer.yml --repo ${{ github.repository }}
          echo "Timer triggered. Next injection in ~3 hours."

